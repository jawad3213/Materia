# ===================================================================
# Materia Local Development Override (docker-compose.override.yml)
# Automatically loaded by Docker Compose in local development.
# Usage: docker compose up -d
# ===================================================================
services:

  # -----------------------------------------------------------------
  # PostgreSQL (Dev: exposed to host for DBeaver/pgAdmin/IntelliJ)
  # -----------------------------------------------------------------
  postgres:
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # -----------------------------------------------------------------
  # Kafka (Dev: exposed to host for local dev tools/CLI)
  # -----------------------------------------------------------------
  kafka:
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"

  # -----------------------------------------------------------------
  # Kafka UI (Dev only: developer inspection web UI)
  # -----------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: materia-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME:-local}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      - kafka
    networks:
      - materia-net

  # -----------------------------------------------------------------
  # Backend (Dev: dev profile, CORS for localhost, exposed port 8080)
  # -----------------------------------------------------------------
  backend:
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

  # -----------------------------------------------------------------
  # Frontend (Dev: exposed frontend port, pointing to API)
  # -----------------------------------------------------------------
  frontend:
    restart: unless-stopped
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${FRONTEND_PORT:-80}:80"
