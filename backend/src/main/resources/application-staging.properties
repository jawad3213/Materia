# ===================================================================
# Staging Environment Configuration (application-staging.properties)
# ===================================================================

spring.application.name=backend2

# Forward headers from AWS ALB
server.forward-headers-strategy=framework

# Database Connection (Injected via AWS ECS / Secrets Manager / Env)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate Staging Settings
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.format-sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:none}

# Swagger / OpenAPI (Enabled in staging for testing and API validation)
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}

# Cookie security for HTTPS Staging
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

# Actuator health checks for AWS ALB & ECS Fargate
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.materia.backend=INFO
