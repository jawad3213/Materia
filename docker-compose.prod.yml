# ===================================================================
# Materia Staging & Production Override Compose (docker-compose.prod.yml)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ===================================================================
services:

  # -----------------------------------------------------------------
  # PostgreSQL (Staging/Prod: strictly internal network, restart always)
  # -----------------------------------------------------------------
  postgres:
    restart: always

  # -----------------------------------------------------------------
  # Kafka (Staging/Prod: strictly internal network, restart always)
  # -----------------------------------------------------------------
  kafka:
    restart: always

  # -----------------------------------------------------------------
  # Backend (Staging/Prod: environment profile, CORS, resource constraints)
  # -----------------------------------------------------------------
  backend:
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # -----------------------------------------------------------------
  # Frontend (Staging/Prod: domain API, port 80, resource limits)
  # -----------------------------------------------------------------
  frontend:
    restart: always
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 512M
