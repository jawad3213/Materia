name: Terraform CI

on:
  pull_request:
    paths:
      - "aws/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - aws/bootstrap
          - aws/environments/staging
          - aws/environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Check formatting
        run: terraform fmt -check -recursive aws

      - name: Validate ${{ matrix.root }}
        working-directory: ${{ matrix.root }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Check the deploy script
        if: matrix.root == 'aws/bootstrap'
        run: shellcheck aws/deploy/deploy.sh
