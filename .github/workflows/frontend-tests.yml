name: Frontend Tests

on:
  pull_request:
    branches:
      - main
      - develop
      - staging
    paths:
      - "frontend/**"
      - "backend/src/test/resources/contracts/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches:
      - main
      - develop
      - staging
    paths:
      - "frontend/**"
      - "backend/src/test/resources/contracts/**"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The screen-rule tests read the shared action matrix from backend/src/test/resources/contracts,
      # so a change to who-may-do-what there re-runs this workflow (spec 002, research R8).
      - name: Run tests
        working-directory: frontend
        run: npm test
