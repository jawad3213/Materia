name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS deploy role
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-ec2.yml
    with:
      environment: prod
      # Add required reviewers to this GitHub environment to gate production deploys.
      github_environment: production
